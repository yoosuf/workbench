services:
  app-postgres:
    image: postgres:16-alpine
    container_name: workbench-app-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: workbench_app
    ports:
      - "5431:5432"
    volumes:
      - app_postgres_data:/var/lib/postgresql/data

  target-postgres:
    image: postgres:16-alpine
    container_name: workbench-target-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: sample_ecommerce
    ports:
      - "5433:5432"
    volumes:
      - ./docker/postgres/target-postgres-init.sql:/docker-entrypoint-initdb.d/init.sql
      - target_postgres_data:/var/lib/postgresql/data

  target-mysql:
    image: mysql:8.4
    container_name: workbench-target-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: mysqlpassword
      MYSQL_DATABASE: sample_ecommerce
    ports:
      - "3307:3306"
    volumes:
      - ./docker/mysql/target-mysql-init.sql:/docker-entrypoint-initdb.d/init.sql
      - target_mysql_data:/var/lib/mysql

  target-mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: workbench-target-mssql
    restart: always
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "MssqlPassword1!"
      MSSQL_PID: "Developer"
    ports:
      - "1434:1433"
    volumes:
      - target_mssql_data:/var/opt/mssql

  target-mssql-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: workbench-target-mssql-init
    depends_on:
      - target-mssql
    restart: "no"
    volumes:
      - ./docker/mssql/target-mssql-init.sql:/docker-entrypoint-initdb.d/init.sql
    entrypoint:
      - /bin/bash
      - -c
      - |
        until /opt/mssql-tools18/bin/sqlcmd -S target-mssql -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" &> /dev/null; do
          echo "Waiting for SQL Server to be ready..."
          sleep 2
        done
        /opt/mssql-tools18/bin/sqlcmd -S target-mssql -U sa -P "$$MSSQL_SA_PASSWORD" -C -d master -Q "IF NOT EXISTS (SELECT name FROM sys.databases WHERE name = 'sample_ecommerce') CREATE DATABASE sample_ecommerce"
        /opt/mssql-tools18/bin/sqlcmd -S target-mssql -U sa -P "$$MSSQL_SA_PASSWORD" -C -d sample_ecommerce -i /docker-entrypoint-initdb.d/init.sql
        echo "MSSQL sample database initialized."
    environment:
      MSSQL_SA_PASSWORD: "MssqlPassword1!"

volumes:
  app_postgres_data:
  target_postgres_data:
  target_mysql_data:
  target_mssql_data:
